<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="description" content="Kata - Modern anime-inspired personal habit tracking command center" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Zen Maru Gothic + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

    <title>Kata • 習慣 — Habit Command Center</title>

    <!-- Immediately unregister any legacy service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
    </script>

    <!-- Self-healing: if an older cached bundle fails to load new hashes, automatically unregister stale workers and reload -->
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('dynamically imported module') > -1 || msg.indexOf('mime type') > -1 || msg.indexOf('loading chunk') > -1) {
          if (!sessionStorage.getItem('kata_reloaded_once')) {
            sessionStorage.setItem('kata_reloaded_once', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
                if ('caches' in window) {
                  caches.keys().then(function(k) {
                    Promise.all(k.map(function(name) { return caches.delete(name); })).then(function() {
                      window.location.reload(true);
                    });
                  });
                } else {
                  window.location.reload(true);
                }
              });
            }
          }
        }
      });
    </script>
  </head>
  <body class="bg-[#0a0d14] text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200 antialiased overflow-x-hidden">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0d14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: rgba(0,242,254,0.12); border: 1px solid rgba(0,242,254,0.35); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #00f2fe; margin-bottom: 16px;">
          型
        </div>
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #94a3b8; text-transform: uppercase;">
          Kata Command Center
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
