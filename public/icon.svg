<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#ff6b8b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" stroke="#00f2fe" stroke-width="4" stroke-dasharray="12 12" opacity="0.4"/>
  
  <!-- Stylized Katana Slash / K symbol -->
  <path d="M160 120 L220 120 L352 392 L292 392 Z" fill="url(#bladeGrad)" filter="url(#glow)"/>
  <path d="M352 140 L280 256 L360 372 L320 372 L256 280 L200 372 L160 372 L236 250 L160 140 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="360" cy="140" r="16" fill="#ff6b8b" filter="url(#glow)"/>
  <circle cx="150" cy="370" r="10" fill="#00e5a3" filter="url(#glow)"/>
  <!-- Kanji 型 (Kata) -->
  <text x="256" y="450" text-anchor="middle" font-family="'Zen Maru Gothic', sans-serif" font-weight="900" font-size="44" fill="#64748b" letter-spacing="4">型 • KATA</text>
</svg>
